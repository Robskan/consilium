services:
  postgres:
    image: postgres:18-alpine
    container_name: consilium-postgres
    restart: unless-stopped

    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-consilium}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-consilium}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consilium -d consilium"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    image: consilium:local
    restart: unless-stopped
    env_file:
      - .env.decrypted
    ports:
      - "3000:3000"

    volumes:
      - consilium_files:/app/data/files
      - ./credentials.json:/app/credentials.json:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  cron:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c 'echo "*/30 * * * * wget -qO- --header=\"Authorization: Bearer $CRON_SECRET\" http://app:3000/api/cron/sync-directory >/dev/null 2>&1" | crond -f -'
    depends_on:
      app:
        condition: service_healthy
volumes:
    postgres_data:
    consilium_files: