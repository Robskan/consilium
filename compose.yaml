services:
  postgres:
    image: postgres:18-alpine
    container_name: consilium-postgres
    restart: unless-stopped

    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-consilium}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-consilium}

volumes:
    postgres_data: